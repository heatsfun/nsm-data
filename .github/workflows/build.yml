name: build coins.json
# Self-sustaining loop: one long job rebuilds coins.json every 5 minutes for ~5.5h,
# then re-dispatches itself. The schedule is only a backup restarter.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # hourly backup restarter (GitHub's */5 schedule proved unreliable)
permissions:
  contents: write
  actions: write
concurrency:
  group: nsm-data-loop
  cancel-in-progress: false # a new trigger waits as "pending" (max one) instead of killing the loop
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      LOOP_SECONDS: "19800" # 5h30m
      INTERVAL: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build loop
        run: |
          git config user.name "nsm-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_SECONDS ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            echo "::group::iteration $i $(date -u +%FT%TZ)"
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            if node build.mjs; then
              git add coins.json modes.json
              if git diff --cached --quiet; then
                echo "no changes"
              else
                git commit -q -m "data: update coins.json"
                for try in 1 2 3; do
                  if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "pushed"; break; fi
                  echo "push failed (try $try)"; git rebase --abort 2>/dev/null; sleep 5
                done
              fi
            else
              echo "::warning::build failed in iteration $i; keeping last good coins.json"
              git checkout -- coins.json modes.json 2>/dev/null || true
            fi
            echo "::endgroup::"
            now=$(date +%s)
            sleep_for=$(( INTERVAL - now % INTERVAL ))
            [ $(( now + sleep_for )) -ge "$end" ] && break
            sleep "$sleep_for"
          done
      - name: Re-dispatch next loop
        if: always()
        run: |
          # Skip if another run is already waiting in the concurrency group (e.g. the hourly backup).
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w build.yml --json status,databaseId \
            -q "[.[] | select((.status==\"pending\" or .status==\"queued\" or .status==\"waiting\") and .databaseId != ${GITHUB_RUN_ID})] | length")
          if [ "${pending:-0}" -gt 0 ]; then echo "a run is already pending; not dispatching"; exit 0; fi
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
