name: build coins.json
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name "nsm-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coins.json modes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update coins.json"
          git pull --rebase origin main
          git push
